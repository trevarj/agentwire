# Copy this to ~/.config/agentwire/config.toml and keep the live file private.

[bridge]
owner_account = "your-account"
allowed_roots = ["/home/you/Workspace"]
state_file = "~/.local/state/agentwire/state.sqlite3"
queue_limit = 10

[secrets]
env_file = "~/.config/agentwire/secrets.env"

[irc]
host = "127.0.0.1"
port = 16698
server_hostname = "irc.example.com"
ca_file = "~/.config/agentwire/ergo-fullchain.pem"
nickname = "agentwire"
username = "agentwire"
realname = "Agentwire agent bridge"
password_env = "AGENTWIRE_IRC_PASSWORD"
# Each channel names the backend that owns it: codex, opencode, claude, or pi.
channels = { "#codex" = "codex" }

# Only read when a channel above is bound to the "codex" backend.
[codex]
socket_path = "$XDG_RUNTIME_DIR/agentwire/codex.sock"
binary = "codex"

# Only read when a channel above is bound to the "claude" backend, for example
# channels = { "#codex" = "codex", "#claude" = "claude" }
[claude]
binary = "claude"
# Optional. Omit to use whatever model the claude CLI defaults to.
model = "claude-opus-5"
# "default" keeps every tool approval flowing to IRC. "acceptEdits", "plan",
# and "bypassPermissions" are also accepted.
permission_mode = "default"
# Optional. Names the variable in the mode-0600 secrets env file that holds the
# credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN). Omit this to reuse
# the credentials the claude CLI already stores. Never put a value here.
api_key_env = "AGENTWIRE_CLAUDE_API_KEY"

# Only read when a channel above is bound to the "pi" backend, for example
# channels = { "#codex" = "codex", "#pi" = "pi" }
[pi]
binary = "pi"
# Create one private IRC channel per new Pi session until bridge restart. Defaults to false.
dedicated_channels = false
# Where running pi TUIs serve their Agentwire extension sockets. Defaults to
# $XDG_RUNTIME_DIR/agentwire/pi, matching the extension.
# socket_dir = "$XDG_RUNTIME_DIR/agentwire/pi"
# Where pi stores session JSONL files. Defaults to ~/.pi/agent/sessions.
# session_root = "~/.pi/agent/sessions"

[stack]
ssh_binary = "ssh"
ssh_host = "your-ssh-alias"
local_port = 16698
remote_host = "127.0.0.1"
remote_port = 6698
remote_cert_path = "/path/to/ergo/fullchain.pem"
startup_timeout = 30
