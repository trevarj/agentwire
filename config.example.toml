# Copy this to ~/.config/irc-bridge/config.toml and keep the live file private.

[bridge]
owner_account = "your-account"
allowed_roots = ["/home/you/Workspace"]
state_file = "~/.local/state/irc-bridge/state.json"
queue_limit = 10
summary_max_lines = 8
summary_max_bytes = 1200
tool_milestone_limit = 12
notify_owner_on_start = true

[secrets]
env_file = "~/.config/irc-bridge/secrets.env"

[irc]
host = "127.0.0.1"
port = 16698
server_hostname = "irc.example.com"
ca_file = "~/.config/irc-bridge/ergo-fullchain.pem"
nickname = "ircbridge"
username = "ircbridge"
realname = "IRC agent bridge"
password_env = "IRC_BRIDGE_IRC_PASSWORD"
channels = { "#codex" = "codex", "#opencode" = "opencode" }

[codex]
socket_path = "$XDG_RUNTIME_DIR/irc-bridge/codex.sock"
binary = "codex"

[opencode]
url = "http://127.0.0.1:14096"
username = "opencode"
password_env = "OPENCODE_SERVER_PASSWORD"
binary = "opencode"

[paste]
url = "https://litterbox.catbox.moe/resources/internals/api.php"
expiry = "1h"
max_bytes = 1048576

[stack]
ssh_binary = "ssh"
ssh_host = "your-ssh-alias"
local_port = 16698
remote_host = "127.0.0.1"
remote_port = 6698
remote_cert_path = "/path/to/ergo/fullchain.pem"
opencode_port = 14096
startup_timeout = 30
