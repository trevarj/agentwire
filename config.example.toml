# Copy this to ~/.config/agentwire/config.toml and keep the live file private.

[bridge]
owner_account = "your-account"
allowed_roots = ["/home/you/Workspace"]
state_file = "~/.local/state/agentwire/state.sqlite3"
queue_limit = 10

[secrets]
env_file = "~/.config/agentwire/secrets.env"

[irc]
host = "127.0.0.1"
port = 16698
server_hostname = "irc.example.com"
ca_file = "~/.config/agentwire/ergo-fullchain.pem"
nickname = "agentwire"
username = "agentwire"
realname = "Agentwire agent bridge"
password_env = "AGENTWIRE_IRC_PASSWORD"
channels = { "#codex" = "codex", "#opencode" = "opencode" }

[codex]
socket_path = "$XDG_RUNTIME_DIR/agentwire/codex.sock"
binary = "codex"

[opencode]
url = "http://127.0.0.1:14096"
username = "opencode"
password_env = "OPENCODE_SERVER_PASSWORD"
binary = "opencode"

[stack]
ssh_binary = "ssh"
ssh_host = "your-ssh-alias"
local_port = 16698
remote_host = "127.0.0.1"
remote_port = 6698
remote_cert_path = "/path/to/ergo/fullchain.pem"
opencode_port = 14096
startup_timeout = 30
