[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwire"
version = "0.1.0"
description = "A private IRCv3 bridge for Codex and OpenCode sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.11,<4"]

[project.scripts]
agentwire = "agentwire.cli:main"
irc-bridge = "agentwire.cli:main"
agentwire-protocol-client = "agentwire.reference_client:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
